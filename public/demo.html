<title>UniNiger</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Concept: application mobile-first. Bandeau marine, accent or, cartes blanches ; une seule colonne centrée sur grand écran. */
:root{
  --bg:#EEF1F5; --card:#FFFFFF; --ink:#0F1B2D; --mut:#5B6778; --line:#D9DFE8;
  --head:#042C53; --gold:#C99A2E; --gold-ink:#3A2A05; --primary:#0B4A85; --primary-ink:#FFFFFF;
  --crit-bg:#FCEBEB; --crit:#A32D2D; --imp-bg:#FAEEDA; --imp:#8A5410;
  --info-bg:#E6F1FB; --info:#1C5C9C; --ok-bg:#E1F5EE; --ok:#0F6E56;
  --font:'Public Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B1522; --card:#13223A; --ink:#E8EEF7; --mut:#9AA9BD; --line:#233552;
  --head:#031F3B; --gold:#E0B04A; --gold-ink:#2A1E02; --primary:#4F8FD6; --primary-ink:#06182B;
  --crit-bg:#3A1A1A; --crit:#F09A9A; --imp-bg:#3A2A10; --imp:#E9B766;
  --info-bg:#12304F; --info:#8FBDEB; --ok-bg:#0F3328; --ok:#6FD3B1; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1522; --card:#13223A; --ink:#E8EEF7; --mut:#9AA9BD; --line:#233552;
  --head:#031F3B; --gold:#E0B04A; --gold-ink:#2A1E02; --primary:#4F8FD6; --primary-ink:#06182B;
  --crit-bg:#3A1A1A; --crit:#F09A9A; --imp-bg:#3A2A10; --imp:#E9B766;
  --info-bg:#12304F; --info:#8FBDEB; --ok-bg:#0F3328; --ok:#6FD3B1; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--font);margin:0}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;text-wrap:balance;line-height:1.2}
p{margin:0}
.wrap{max-width:640px;margin:0 auto;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:0}
.bar{background:var(--head);color:#fff}
.bar .wrap{display:flex;align-items:center;gap:12px;padding-block:14px}
.logo{font-weight:800;font-size:20px;letter-spacing:-.01em}
.logo b{color:var(--gold)}
.sp{flex:1}
.sub{font-size:12px;opacity:.8}
.ib{background:none;border:0;color:inherit;width:40px;height:40px;display:grid;place-items:center;border-radius:10px;cursor:pointer;position:relative}
.ib:hover{background:rgba(255,255,255,.12)}
.dot{position:absolute;top:6px;right:6px;min-width:17px;height:17px;border-radius:9px;background:var(--gold);color:var(--gold-ink);font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 4px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.s{width:16px;height:16px}
main{padding-block:16px 96px;display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.card h3{font-size:16px;margin-bottom:6px}
.muted{color:var(--mut)} .small{font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:12px;border:1px solid var(--primary);background:var(--primary);color:var(--primary-ink);font-weight:700;cursor:pointer;text-align:center}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}
.btn.ghost{background:transparent;color:var(--primary)}
.btn.red{background:var(--crit);border-color:var(--crit);color:#fff}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px;border-radius:10px}
.btn.full{width:100%}
.btn:focus-visible,.ib:focus-visible,.tab:focus-visible,.lk:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.est:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.lk{background:none;border:0;color:var(--primary);font-weight:600;cursor:pointer;padding:6px 0;text-decoration:underline}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:10px}
.hero{background:var(--head);color:#fff;border-radius:16px;padding:20px 18px;display:flex;flex-direction:column;gap:10px}
.hero h1{font-size:24px;letter-spacing:-.01em}
.hero p{opacity:.88}
.hero .gl{color:var(--gold)}
.sec{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin-top:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.est{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 10px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;min-width:0}
.est.off{opacity:.62;cursor:default}
.est.on{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold) inset}
.est b{font-size:15px}.est span.n{font-size:12px;color:var(--mut);overflow-wrap:anywhere}
.lgo{width:52px;height:52px;border-radius:50%;object-fit:cover;border:2px solid var(--gold);background:#fff;flex:none}
.lgo.sm{width:34px;height:34px;border-width:1px}
.mk{width:52px;height:52px;border-radius:50%;background:var(--head);color:var(--gold);display:grid;place-items:center;font-weight:800;font-size:15px;border:2px solid var(--gold)}
.pill{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--info-bg);color:var(--info)}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
label{display:block;font-weight:600;font-size:13px;margin-bottom:4px}
input,select,textarea{width:100%;min-height:46px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
textarea{min-height:84px;resize:vertical}
.chk{display:flex;gap:10px;align-items:flex-start;font-weight:400}
.chk input{width:20px;min-height:20px;margin-top:2px;flex:none}
.demo{background:var(--imp-bg);color:var(--imp);border-radius:10px;padding:10px 12px;font-size:13px}
.ann{border:1px solid var(--line);border-left-width:5px;border-radius:12px;padding:12px;background:var(--card);display:flex;flex-direction:column;gap:6px}
.ann.l3{border-left-color:var(--crit);background:var(--crit-bg)}
.ann.l2{border-left-color:var(--imp)}
.ann.l1{border-left-color:var(--info)}
.ann-h{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ann h4{font-size:15px}
.meta{font-size:12px;color:var(--mut)}
.chip{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px}
.c3{background:var(--crit);color:#fff}.c2{background:var(--imp-bg);color:var(--imp)}.c1{background:var(--info-bg);color:var(--info)}
.cn{background:var(--ok-bg);color:var(--ok)}.cp{background:var(--line);color:var(--mut)}
.pinx{font-size:11px;font-weight:700;color:var(--crit)}
.badge{background:var(--gold);color:var(--gold-ink);font-size:11px;font-weight:700;padding:1px 7px;border-radius:99px}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
.tabs .wrap{display:flex;gap:2px;padding-block:6px}
.tab{flex:1;min-width:0;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--mut);padding:6px 2px;border-radius:10px;cursor:pointer}
.tab.on{color:var(--primary);background:var(--info-bg)}
.stops{display:flex;flex-direction:column}
.stop{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.stop:last-child{border:0}
.pt{width:14px;height:14px;border-radius:50%;border:3px solid var(--line);background:var(--card);flex:none}
.pt.pass{background:var(--ok);border-color:var(--ok)}
.pt.here{background:var(--gold);border-color:var(--gold-ink);box-shadow:0 0 0 4px rgba(201,154,46,.3)}
.st{flex:1;min-width:0}
.st b{display:block;overflow-wrap:anywhere}
.eta{font-weight:800;font-variant-numeric:tabular-nums;font-size:14px;white-space:nowrap}
.bell{background:none;border:1px solid var(--line);border-radius:10px;width:40px;height:40px;display:grid;place-items:center;cursor:pointer;color:var(--mut)}
.bell.on{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}
.seg{display:flex;gap:6px}
.seg button{flex:1;min-height:38px;border:1px solid var(--line);border-radius:10px;background:var(--card);font-weight:600;cursor:pointer}
.seg button.on{background:var(--head);color:#fff;border-color:var(--head)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal button,.cal div{min-height:42px;border:1px solid var(--line);border-radius:8px;background:var(--card);font-variant-numeric:tabular-nums;position:relative}
.cal div.h{border:0;background:none;min-height:auto;font-size:11px;color:var(--mut);font-weight:700}
.cal button.today{border-color:var(--gold);border-width:2px}
.cal button.sel{background:var(--head);color:#fff}
.cal button i{position:absolute;bottom:4px;left:50%;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:var(--gold)}
.ev{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.ev:last-child{border:0}
.ev .t{font-weight:800;font-variant-numeric:tabular-nums;min-width:52px}
.who{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--line)}
.who:last-child{border:0}
.who>div:first-child{min-width:0;flex:1 1 180px}
.ovl{position:fixed;inset:0;background:rgba(3,15,30,.6);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.mod{background:var(--card);width:100%;max-width:640px;max-height:90%;overflow:auto;border-radius:18px 18px 0 0;padding:18px max(16px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
@media(min-width:700px){.ovl{align-items:center}.mod{border-radius:18px}}
.mod h3{font-size:18px}
.num{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.num b{font-variant-numeric:tabular-nums}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.stat div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat b{font-size:24px;display:block;font-variant-numeric:tabular-nums}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--head);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:80;max-width:calc(100% - 32px);display:none;box-shadow:0 6px 20px rgba(0,0,0,.3)}
#toast.show{display:block}
.off-b{background:var(--imp-bg);color:var(--imp);padding:8px 12px;border-radius:10px;font-size:13px;font-weight:600}
.flag{width:28px;height:19px;border-radius:3px;border:1px solid var(--line);vertical-align:middle}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div id="toast" role="status" aria-live="polite"></div>

 var L=S.lines.find(function(l){return l.id===lid});if(!L)return;
 var t=now(),times=(L.state&&L.state.times)||{};times[idx]=t;
 L.state={idx:idx,at:t,times:times};
 log('Ligne '+lid+' : bus à "'+L.stops[idx]+'"');
 S.accounts.forEach(function(a){
  if(a.role!=='student'||a.status!=='valid')return;
  var s=a.subs||[];
  if(s.indexOf(lid+':'+idx)>-1)notify(a.phone,'Le bus de la ligne '+lid+' est à '+L.stops[idx]+'.');
  if(idx+1<L.stops.length&&s.indexOf(lid+':'+(idx+1))>-1)notify(a.phone,'Le bus approche de '+L.stops[idx+1]+' ('+fmtEta(eta(L,idx+1))+').');
 });
 save();toast('Arrivée signalée : '+L.stops[idx]);render();
}

 demo:function(d){var a=S.accounts.find(function(x){return x.phone===d.p});if(a)login(a)},
 logout:function(){S.session=null;save();ui.screen='grid';ui.modal=null;render()},
 sossend:function(){var u=cur();S.accounts.forEach(function(a){if(a.role==='delegate'||a.role==='admin')notify(a.phone,'ALERTE SOS de '+u.name+' ('+u.phone+')')});log('SOS envoyé par '+u.name);save();ui.modal=null;toast('Alerte SOS enregistrée (démonstration)');render()},
 resend:function(){ui.otp=String(Math.floor(100000+Math.random()*900000));render();toast('Nouveau code généré')},
 reset:function(){S=seed();save();ui.screen='grid';ui.modal=null;toast('Données de démonstration réinitialisées');render()}
};
document.addEventListener('click',function(e){
 var el=e.target.closest('[data-a]');if(!el)return;
 var fn=A[el.dataset.a];if(fn)fn(el.dataset,el,e);

var F={
 signup:function(f){
  var phone=f.phone.replace(/\D/g,''),card=f.card.trim().toUpperCase();
  if(!f.ok)return toast('Acceptez la charte pour continuer');
  if(phone.length!==8)return toast('Le téléphone doit avoir 8 chiffres');
  if(f.pass.length<6)return toast('Mot de passe trop court');
  if(S.accounts.some(function(a){return a.phone===phone}))return toast('Ce téléphone a déjà un compte. Connectez-vous.');
  if(S.accounts.some(function(a){return a.card&&a.card===card}))return toast('Ce numéro de carte est déjà inscrit');
  ui.signup={name:(f.prenom.trim()+' '+f.nom.trim()),card:card,phone:phone,filiere:f.filiere.trim(),annee:f.annee,pass:hash(f.pass)};
  ui.otp=String(Math.floor(100000+Math.random()*900000));ui.step=2;render();window.scrollTo(0,0);
 },
 otp:function(f){
  if(f.otp.trim()!==ui.otp)return toast('Code incorrect');
  var s=ui.signup,cc=(f.cc||'').trim().toUpperCase(),code=S.codes.find(function(c){return c.code===cc}),st='pending';
  if(cc&&!code)return toast('Code de classe inconnu');
  if(code){st='valid';code.uses++}
  var a={id:uid(),role:'student',name:s.name,card:s.card,phone:s.phone,pass:s.pass,status:st,filiere:s.filiere,annee:s.annee,subs:[],toured:false};
  S.accounts.push(a);log('Nouvelle inscription : '+a.name+(st==='valid'?' (code de classe)':' (à valider)'));
  S.accounts.forEach(function(x){if(x.role==='delegate'&&st==='pending')notify(x.phone,'Nouvelle inscription à valider : '+a.name)});
  ui.signup=null;ui.otp=null;login(a);
  toast(st==='valid'?'Compte validé. Bienvenue !':'Inscription envoyée. Un délégué doit la valider.');
 },
 login:function(f){
  var p=f.phone.replace(/\D/g,''),a=S.accounts.find(function(x){return x.phone===p&&x.pass===hash(f.pass)});
  if(!a)return toast('Téléphone ou mot de passe incorrect');
  if(a.status==='rejected')return toast('Votre inscription a été refusée. Contactez votre délégué.');
  login(a);
 },
 ann:function(f){
  var u=cur(),lv=Number(f.level);
  S.ann.unshift({id:uid(),level:lv,scope:f.scope,title:f.title.trim(),body:f.body.trim(),author:u.name,badge:u.role==='delegate',t:now()});
  if(f.date)S.events.push({id:uid(),date:f.date,time:f.time||'08:00',title:f.title.trim(),place:'Voir annonce'});
  if(lv===3)S.accounts.forEach(function(a){if(a.role==='student'&&a.status==='valid')notify(a.phone,'ALERTE : '+f.title.trim())});
  log('Annonce publiée : '+f.title.trim());save();toast('Annonce publiée');render();
 },
 code:function(f){
  var base=f.classe.trim().toUpperCase().replace(/[^A-Z0-9]+/g,'-').slice(0,14);
  S.codes.push({code:base+'-'+Math.floor(1000+Math.random()*9000),classe:f.classe.trim(),uses:0});save();toast('Code créé');render();
 },
 group:function(f){var u=cur();S.groups.push({id:uid(),name:f.name.trim(),desc:f.desc.trim(),members:[u.phone]});save();toast('Groupe créé');render()},
 lost:function(f){var u=cur();S.lost.push({id:uid(),kind:f.kind,text:f.text.trim(),place:f.place.trim(),by:u.name,t:now(),done:false});save();toast('Objet publié');render()},
 driver:function(f){
  var p=f.phone.replace(/\D/g,'');if(p.length!==8)return toast('Le téléphone doit avoir 8 chiffres');
  if(S.accounts.some(function(a){return a.phone===p}))return toast('Ce téléphone est déjà utilisé');
  S.accounts.push({id:uid(),role:'driver',name:f.name.trim(),card:'',phone:p,pass:hash(f.pass),status:'valid',line:f.line,subs:[],toured:true});log('Compte chauffeur créé : '+f.name.trim());save();toast('Compte chauffeur créé');render();
 },
 req:function(f){S.reqs.push({name:f.name.trim(),city:f.city.trim(),contact:f.contact.trim()});log('Demande d\'ouverture : '+f.name.trim());save();ui.modal=null;toast('Demande enregistrée. Merci !');render()},
 usecode:function(f){
  var u=cur(),cc=f.cc.trim().toUpperCase(),c=S.codes.find(function(x){return x.code===cc});
  if(!c)return toast('Code de classe inconnu');
  c.uses++;u.status='valid';ui.modal=null;save();toast('Compte validé');render();
 },
 problem:function(f){
  var u=cur(),L=S.lines.find(function(l){return l.id===u.line}),txt=f.type+(f.msg?' : '+f.msg.trim():'');
  L.dis={text:txt,t:now()};
  S.ann.unshift({id:uid(),level:3,scope:'private',title:'Ligne '+L.id+' : '+f.type,body:txt+'. Signalé par le chauffeur.',author:u.name,badge:false,t:now()});
  S.accounts.forEach(function(a){if(a.role==='student'&&a.status==='valid')notify(a.phone,'Ligne '+L.id+' perturbée : '+txt)});
  log('Perturbation ligne '+L.id+' : '+txt);save();ui.modal=null;toast('Les étudiants sont prévenus');render();
 }
};

 var fn=F[f.dataset.form];if(fn)fn(d);
});
